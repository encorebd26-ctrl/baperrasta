    const F=S.items.filter(it=>{const cur=S.ed[it.t]??T[it.t]??it.t;return!((S.rg=='h'&&!it.h)||(S.rg=='s'&&it.h)||(S.q&&!cur.includes(S.q)&&!it.t.includes(S.q)))}),P=Math.max(1,Math.ceil(F.length/N));S.pn=Math.min(S.pn,P-1);
    F.slice(S.pn*N,S.pn*N+N).forEach(it=>{const cur=S.ed[it.t]??T[it.t]??it.t;
      const a=E('textarea',{rows:Math.min(4,1+(cur.length/50|0)),value:cur,className:cur!==it.t?'chg':'',oninput:e=>{S.ed[it.t]=e.target.value;a.className=e.target.value!==it.t?'chg':'';upd()}});
      box.append(card(E('div',{className:'row',style:'align-items:flex-start;flex-wrap:nowrap'},a,btn('↺',()=>{S.ed[it.t]=it.t;a.value=it.t;a.className='';upd()},'ic'),btn('✕',()=>{S.ed[it.t]='';a.value='';a.className='chg';upd()},'ic dng'))))});
    lab.textContent=`${F.length}টি লেখা · পাতা ${S.pn+1}/${P}`;pg.replaceChildren(btn('← আগে',()=>{S.pn=Math.max(0,S.pn-1);list();scrollTo(0,0)}),lab,btn('পরে →',()=>{S.pn=Math.min(P-1,S.pn+1);list();scrollTo(0,0)}));upd()};
  const pg=E('div',{className:'row',style:'justify-content:space-between;margin:8px 0'});
  bar.append(E('div',null,cnt,btn('প্রকাশ করুন',()=>run(async()=>{const o={...T};for(const k in S.ed){const v=san(S.ed[k]);v===k?delete o[k]:o[k]=v}await cfgSet('texts',Object.keys(o).length?o:undefined);S.ed={};draw()},'প্রকাশ হয়েছে, লাইভ'),'pri')));
  m.append(hd('গেমের লেখা','মেনু, পত্রিকা, হেডলাইন, ডায়লগ। হলুদ দাগ মানে বদলানো।'),
    card(E('div',{className:'row'},E('input',{className:'g',placeholder:'খুঁজুন…',value:S.q,oninput:e=>{S.q=e.target.value;S.pn=0;list()}}),
      seg([['all','সব'],['h','মেনু ও পত্রিকা'],['s','হেডলাইন ও ডায়লগ']],S.rg,v=>{S.rg=v;S.pn=0;draw()}))),pg,box,bar);
  list()}

/* ---------- পেজ ---------- */
const bs=h=>h.replace(/^(\s*<!doctype[^>]*>)?/i,(a,d)=>(d||'')+'<base href="'+location.origin+'/">');
async function vPg(m){
  const k='page_'+S.pg;
  m.append(hd('পেজ','ডিসক্লেইমার ও এডিটরের পাতা। প্রকাশ করলেই লাইভ।',E('span',{className:'chip '+(S.C[k]?'custom':''),textContent:S.C[k]?'এডিট করা':'আসল ফাইল'})),
    card(seg([['disclaimer','ডিসক্লেইমার'],['editor','এডিটর']],S.pg,v=>{S.pg=v;draw()})));
  if(PG[S.pg]==null){try{PG[S.pg]=S.C[k]||await(await fetch(S.pg+'.html',{cache:'no-store'})).text()}catch{PG[S.pg]=''}return draw()}
  let vis=0;const ta=E('textarea',{className:'code',value:PG[S.pg],oninput:()=>PG[S.pg]=ta.value}),fr=E('iframe',{hidden:true});
  const sync=()=>{if(vis){const d=fr.contentDocument;d.designMode='off';PG[S.pg]='<!doctype html>\n'+d.documentElement.outerHTML.replace(/<base href="[^"]*">/,'');ta.value=PG[S.pg]}};
  const show=v=>{sync();vis=v;ta.hidden=!!v;fr.hidden=!v;if(v){fr.onload=()=>fr.contentDocument.designMode='on';fr.srcdoc=bs(PG[S.pg])}};
  m.append(card(E('div',{className:'row',style:'margin-bottom:10px'},seg([[0,'কোড'],[1,'ভিজুয়াল']],0,v=>show(v)),E('span',{className:'g'}),
    btn('প্রকাশ করুন',()=>run(async()=>{sync();await cfgSet(k,PG[S.pg])},'প্রকাশ হয়েছে, লাইভ'),'pri'),
    btn('আসলে ফিরুন',()=>confirm('আসল ফাইলে ফিরবেন?')&&run(async()=>{await cfgSet(k,undefined);PG[S.pg]=null;draw()},'আসলে ফেরা হয়েছে'),'dng')),ta,fr),
    E('p',{className:'mu',textContent:'গেমের ভেতরের লিংক দিয়ে ঢুকলে এই এডিট করা সংস্করণ খুলবে।'}))}

/* ---------- সেটআপ ---------- */
const SQL=`create table if not exists site_config(key text primary key,value jsonb not null);
alter table site_config enable row level security;
drop policy if exists "cfg_all" on site_config;
create policy "cfg_all" on site_config for all using(true) with check(true);
drop policy if exists "sc_upd" on scores;
create policy "sc_upd" on scores for update using(true) with check(true);
drop policy if exists "sc_del" on scores;
create policy "sc_del" on scores for delete using(true);
insert into storage.buckets(id,name,public) values('audio','audio',true) on conflict do nothing;
drop policy if exists "au_all" on storage.objects;
create policy "au_all" on storage.objects for all using(bucket_id='audio') with check(bucket_id='audio');`;
function vSu(m){
  const stp=(n,...c)=>card(E('div',{className:'step'},E('i',{textContent:n}),E('div',{className:'g'},...c)));
  m.append(hd('সেটআপ','একবারের কাজ। এরপর আর কিছু ডাউনলোড বা ডিপ্লয় করতে হবে না।',E('span',{className:'chip '+(S.ok?'custom':'removed'),textContent:S.ok?'চালু আছে':'বাকি আছে'})),
    stp(1,E('b',{textContent:'SQL কপি করুন'}),E('pre',{textContent:SQL}),btn('কপি করুন',()=>navigator.clipboard.writeText(SQL).then(()=>toast('✓ কপি হয়েছে')),'pri')),
    stp(2,E('b',{textContent:'Supabase-এ চালান'}),E('p',{className:'mu',textContent:'Supabase → SQL Editor → পেস্ট করুন → Run চাপুন।'})),
    stp(3,E('b',{textContent:'যাচাই করুন'}),E('p',{className:S.ok?'ok':'no',textContent:S.ok?'✓ সংযোগ ঠিক আছে, সব অনলাইনে সেভ হচ্ছে।':'✗ এখনো সংযোগ হয়নি।'}),btn('আবার দেখুন',()=>init())),
    E('p',{className:'mu',textContent:'পাসওয়ার্ড নেই: এই পেজের লিংক যার কাছে আছে সে-ই সব বদলাতে পারবে। লিংক গোপন রাখুন।'}))}

const V={home:vHome,sc:vSc,au:vAu,tx:vTx,pg:vPg,su:vSu};
function draw(){
  $('#nav').replaceChildren(...[['home','🏠','হোম'],['sc','🏆','স্কোর'],['au','🔊','অডিও'],['tx','✏️','লেখা'],['pg','📄','পেজ'],['su','⚙️','সেটআপ']].map(([k,i,l])=>E('button',{className:S.tab==k?'on':'',onclick:()=>go(k)},E('b',{textContent:i}),l)));
  const d=$('#dot');d.className=S.ok?'on':'';d.textContent=S.ok?'● অনলাইন':'● সেটআপ বাকি';
  const m=$('#m');m.replaceChildren();V[S.tab](m)}
async function init(){
  try{const r=await fetch(SB+'/rest/v1/site_config?select=key,value',{headers:HD});S.ok=r.ok;S.C={};if(r.ok)(await r.json()).forEach(x=>S.C[x.key]=x.value)}catch{S.ok=false}
  try{S.src=await(await fetch('index.html',{cache:'no-store'})).text()}catch{}
  scan();if(!S.ok&&S.tab=='home')S.tab='home';draw();sc()}
init();
</script></body></html>
